databaseChangeLog:
  - changeSet:
      id: 105415eb-3659-4b6a-b9b1-f9d512612f32
      author: springrestspecialist
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(15)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR
