databaseChangeLog:
  - changeSet:
      id: d384853a-f541-4b42-97ad-5e0628963c43
      author: springrestspecialist
      changes:
        - createTable:
            tableName: restaurants
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
              - column:
                  name: delivery_fee
                  type: DECIMAL
              - column:
                  name: cuisine_id
                  type: UUID
        - addForeignKeyConstraint:
            baseColumnNames: cuisine_id
            baseTableName: restaurants
            constraintName: restaurants_cuisines_fk
            referencedColumnNames: id
            referencedTableName: cuisines
