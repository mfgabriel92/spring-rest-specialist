databaseChangeLog:
  - changeSet:
      id: 01ba00e7-d5b9-4219-93de-3d955e8140ad
      author: springrestspecialist
      changes:
        - createTable:
            tableName: product_photos
            columns:
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: product_id
            baseTableName: product_photos
            constraintName: product_photos_products_fk
            referencedColumnNames: id
            referencedTableName: products