databaseChangeLog:
  - changeSet:
      id: d384853a-f541-4b42-97ad-5e0628963c43
      author: springrestspecialist
      changes:
        - createTable:
            tableName: restaurants_payment_methods
            columns:
              - column:
                  name: restaurant_id
                  type: UUID
              - column:
                  name: payment_method_id
                  type: UUID
        - addPrimaryKey:
            tableName: restaurants_payment_methods
            columnNames: restaurant_id, payment_method_id
            constraintName: restaurants_payment_methods_pk
        - addForeignKeyConstraint:
            baseColumnNames: restaurant_id
            baseTableName: restaurants_payment_methods
            constraintName: restaurants_payment_methods_restaurant_fk
            referencedColumnNames: id
            referencedTableName: restaurants
        - addForeignKeyConstraint:
            baseColumnNames: payment_method_id
            baseTableName: restaurants_payment_methods
            constraintName: restaurants_payment_methods_payment_methods_fk
            referencedColumnNames: id
            referencedTableName: payment_methods
