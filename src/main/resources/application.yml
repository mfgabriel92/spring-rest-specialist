spring:
  application:
    name: spring-rest-specialist
  datasource:
    url: jdbc:postgresql://localhost:5432/spring-rest-specialist
    username: postgres
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
