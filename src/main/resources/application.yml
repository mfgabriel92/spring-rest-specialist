spring:
  application:
    name: spring-rest-specialist
  datasource:
    url: jdbc:postgresql://localhost:5432/springrestspecialist?serverTimezone=UTC
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true